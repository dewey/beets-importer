before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
brews:
  - name: beets-importer
    tap:
      owner: dewey
      name: beets-importer
      branch: main
    folder: Formula
    commit_author:
      name: Philipp Defner
      email: mail@notmyhostna.me
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/dewey/beets-importer"
    description: "TUI tool for importing music into beets"
    license: "MIT"
