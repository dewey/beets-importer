# beets-importer configuration
# Uncomment and fill in the values for your setup.
# Run 'beets-importer config show' to verify the result.
#
# ── Required for 'import' and 'upgrades' ──────────────────────────────────────
#
# Folder with new albums to import or compare with your library.
# source: ~/Music/Music Library Beets/Inbox
#
# ── Taken from beets when not set ─────────────────────────────────────────────
# beets-importer asks 'beet config' for these. Set one only to override it.
#
# beets database. Default: 'library' in your beets config.
# db: ~/Music/Music Library Beets/Library/musiclibrary.db
#
# The beet program, or a wrapper script that calls it. Default: 'beet' on your PATH.
# See https://github.com/dewey/beets-importer#beet-wrapper-script
# beet: ~/Music/Music Library Beets/beet.sh
#
# beets state file, used by 'import' to skip folders beets already processed.
# Needs 'incremental: yes' in your beets config. Default: 'statefile' in your
# beets config.
# state_file: ~/.config/beets/state.pickle
#
# ── Where beets-importer keeps its files ──────────────────────────────────────
#
# Folder for the ignore list, the report store and the scan cache.
# Default: a 'beets-importer' folder next to the beets database.
# data_dir: ~/Music/Music Library Beets/Library/beets-importer
#
# Folder that 'report' writes index.html to. Default: 'report' in the data_dir.
# report_output: ~/Music/report
#
# ── Scanning ──────────────────────────────────────────────────────────────────
# Both apply to 'import' and 'upgrades'.
#
# Print a warning for every folder that could not be scanned, instead of one
# count at the end. Default: false
# verbose: false
#
# Do not use the scan cache and read every folder again. Useful after you moved
# files by hand. Default: false
# no_cache: false
#
# ── Doctor ────────────────────────────────────────────────────────────────────
# Settings for 'beets-importer doctor'. All keys are optional.
#
# doctor:
#   # Bitrate threshold in kbps. Tracks below this are flagged as low quality.
#   # low_quality_threshold_kbps: 128
#
#   # All linters run by default. Set one to false to turn it off.
#   # linters:
#   #   empty_dirs: true
#   #   untracked_dirs: true
#   #   low_quality: true
#   #   lowercase_metadata: true
#   #   protected_audio: true
#   #   missing_artwork: true
#   #   missing_year: true
#   #   split_albums: true
#   #   split_imports: true
#   #   artist_variants: true
#   #   duplicate_names: true
#
# ── Ignore ────────────────────────────────────────────────────────────────────
# Albums that no command suggests or checks: the import picker, 'import
# --retag', 'upgrades' and the doctor linters that read the beets database.
# Names are compared without case.
#
# ignore:
#   albums:
#     - "! random !"
#
# ── Navidrome ─────────────────────────────────────────────────────────────────
# Needed by 'import --retag --from-playlist'. Navidrome's music folder must
# be the same folder as beets' 'directory:', so track paths line up.
#
# navidrome:
#   url: https://music.example.com
#   username: me
#   # Command that prints the password, so it is not stored in this file.
#   password_command: op read op://Private/Navidrome/password
